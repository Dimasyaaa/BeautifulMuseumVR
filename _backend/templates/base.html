<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VR Museum{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="bi bi-museum"></i> VR Museum Admin</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-speedometer2"></i> Дашборд</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/exhibits"><i class="bi bi-image"></i> Экспонаты</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/users"><i class="bi bi-people"></i> Пользователи</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/quiz"><i class="bi bi-question-circle"></i> Викторина</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/leaderboard"><i class="bi bi-trophy"></i> Лидеры</a></li>
                </ul>
                <a href="/docs" class="btn btn-outline-light btn-sm" target="_blank"><i class="bi bi-code-slash"></i> API Docs</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/script.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
