{% extends "base.html" %}
{% block title %}Дашборд - VR Museum{% endblock %}

{% block content %}
<h1 class="mb-4"><i class="bi bi-speedometer2"></i> Панель управления</h1>

<div class="row g-4 mb-4">
    <div class="col-md-4">
        <div class="card text-white bg-primary h-100">
            <div class="card-body">
                <h5 class="card-title">Всего экспонатов</h5>
                <h2 class="display-4">{{ total_exhibits }}</h2>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-white bg-success h-100">
            <div class="card-body">
                <h5 class="card-title">Зарегистрировано пользователей</h5>
                <h2 class="display-4">{{ total_users }}</h2>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-white bg-info h-100">
            <div class="card-body">
                <h5 class="card-title">Всего просмотров в VR</h5>
                <h2 class="display-4">{{ total_views }}</h2>
            </div>
        </div>
    </div>
</div>
{% endblock %}
